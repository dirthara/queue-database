services:
  mago:
    image: ghcr.io/carthage-software/mago:1.47.3
    profiles: ["tools"]
    user: "${LOCAL_UID:-1000}:${LOCAL_GID:-1000}"
    working_dir: /app
    volumes:
      - .:/app
  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_DB: dirthara
      POSTGRES_USER: dirthara
      POSTGRES_PASSWORD: dirthara
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dirthara -d dirthara"]
      interval: 2s
      timeout: 3s
      retries: 15
  mysql:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: dirthara
      MYSQL_USER: dirthara
      MYSQL_PASSWORD: dirthara
      MYSQL_ROOT_PASSWORD: dirthara
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-udirthara", "-pdirthara"]
      interval: 3s
      timeout: 3s
      retries: 30
      start_period: 20s
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_PID: Developer
      MSSQL_SA_PASSWORD: "Dirthara!2026"
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P \"$$MSSQL_SA_PASSWORD\" -C -Q 'SELECT 1'"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 20s
  php:
    depends_on:
      postgres:
        condition: service_healthy
      mysql:
        condition: service_healthy
      sqlserver:
        condition: service_healthy
    build:
      context: .
      dockerfile: Docker/Dockerfile
      args:
        PHP_VERSION: ${PHP_VERSION:-8.5}
        LOCAL_UID: ${LOCAL_UID:-1000}
        LOCAL_GID: ${LOCAL_GID:-1000}
    working_dir: /app
    init: true
    command: ["sleep", "infinity"]
    volumes:
      - .:/app
